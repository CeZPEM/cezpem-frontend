[build]
  command = "yarn build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# force the PDF to download instead of opening in the browser viewer
[[headers]]
  for = "/cartilha/Cartilha_ENEM_2026.pdf"
  [headers.values]
    Content-Disposition = 'attachment; filename="Cartilha_ENEM_2026.pdf"'

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cartilha"
  to = "/cartilha/Cartilha_ENEM_2026.pdf"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = true

# https://docs.netlify.com/cli/manage-functions/#app
# https://docs.netlify.com/configure-builds/file-based-configuration/#sample-netlify-toml-file
# https://docs.netlify.com/configure-builds/file-based-configuration/#build-settings